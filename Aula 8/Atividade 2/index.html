<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Lite</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="chat">

        <div class="header">
            <h1>Meu Chat</h1>

            <i class="fa-solid fa-ellipsis-vertical menu-chat"></i>
        </div>

        <div class="messages">

            <div class="message received">
                <span>Oi...</span>

                <i class="fa-solid fa-chevron-down dropdown-icon"></i>

                <span class="check">
                    <i class="fa-solid fa-check-double"></i>
                </span>

                <div class="dropdown">
                    <p>Responder</p>
                    <p>Encaminhar</p>
                    <p>Excluir</p>
                </div>
            </div>

        
            <div class="message received">
                <span>Tu não me ama mais?</span>

                <i class="fa-solid fa-chevron-down dropdown-icon"></i>

                <span class="check">
                    <i class="fa-solid fa-check-double"></i>
                </span>

                <div class="dropdown">
                    <p>Responder</p>
                    <p>Encaminhar</p>
                    <p>Excluir</p>
                </div>
            </div>

            <div class="message sent">
                <span>Oi, boa tarde.</span>

                <i class="fa-solid fa-chevron-down dropdown-icon"></i>

                <span class="check viewed">
                    <i class="fa-solid fa-check-double"></i>
                </span>

                <div class="dropdown">
                    <p>Editar</p>
                    <p>Copiar</p>
                    <p>Excluir</p>
                </div>
            </div>

            <div class="message sent">
                <span>Quem é você mesmo?</span>

                <i class="fa-solid fa-chevron-down dropdown-icon"></i>

                <span class="check viewed">
                    <i class="fa-solid fa-check-double"></i>
                </span>

                <div class="dropdown">
                    <p>Editar</p>
                    <p>Copiar</p>
                    <p>Excluir</p>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
