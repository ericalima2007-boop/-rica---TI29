<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa de Informação</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="info-box">
        <div class="info-label">
            <i class="fa-solid fa-circle-info"></i>
            <span>Note</span>
        </div>

        <div class="info-content">
            <p>The intermediate repository interface is annotated with
            <code>@NoRepositoryBean</code>. Make sure you add that
            annotation to all repository interfaces for which Spring Data
            should not create instances at runtime.</p>
        </div>
    </div>

</body>
</html>
